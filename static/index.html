<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UCI Nature — Wildlife Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:   #0064A4;
    --dark:   #1B3D6D;
    --green:  #7AB800;
    --gold:   #FFD200;
    --red:    #E53E3E;
    --orange: #ED8936;
    --bg:     #F0F2F5;
    --card:   #FFFFFF;
    --border: #E2E8F0;
    --text:   #1A202C;
    --muted:  #718096;
    --ease:   cubic-bezier(.4,0,.2,1);
  }
  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  header.topbar {
    height: 64px;
    background: var(--dark);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    z-index: 10;
  }
  .topbar .badge {
    background: var(--blue);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }
  .topbar .env {
    font-size: 12px;
    color: rgba(255,255,255,.6);
    padding: 4px 10px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(360px, 420px) 1fr;
    gap: 20px;
    padding: 20px;
    overflow: hidden;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .panel-header .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .panel-footer {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: #FAFBFC;
  }

  /* Tree */
  .tree { font-size: 13px; }
  .tree-node {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 0;
    cursor: pointer;
    user-select: none;
    transition: background .12s var(--ease);
  }
  .tree-node:hover { background: #F0F4F8; }
  .tree-node.selected { background: #E6F0F9; }
  .tree-node .caret {
    width: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    transition: transform .15s var(--ease);
    flex-shrink: 0;
  }
  .tree-node.open > .caret { transform: rotate(90deg); }
  .tree-node .caret.blank { visibility: hidden; }
  .tree-node .folder-icon { flex-shrink: 0; color: var(--blue); }
  .tree-node .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-node input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--blue);
    cursor: pointer;
  }
  .tree-children { display: none; }
  .tree-children.open { display: block; }
  .tree-loading, .tree-empty {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 14px 6px 40px;
    font-style: italic;
  }

  /* Run controls */
  .selected-list {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    max-height: 140px;
    overflow-y: auto;
  }
  .selected-list:empty::before {
    content: "No folders selected.";
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #E6F0F9;
    color: var(--dark);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 12px;
    margin: 3px 4px 3px 0;
  }
  .chip button {
    background: none;
    border: none;
    color: var(--dark);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    opacity: .6;
  }
  .chip button:hover { opacity: 1; }

  .form-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    font-size: 13px;
  }
  .form-row label { color: var(--muted); min-width: 110px; }
  .form-row input[type="number"] {
    width: 90px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
  }
  .form-row input[type="checkbox"] { accent-color: var(--blue); }

  .estimate {
    font-size: 12px;
    color: var(--muted);
    padding: 2px 18px 10px;
  }
  .estimate b { color: var(--text); font-weight: 600; }

  .btn {
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: all .12s var(--ease);
  }
  .btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .btn-primary:hover:not(:disabled) { background: var(--dark); border-color: var(--dark); color: #fff; }

  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* Log viewer */
  .log-viewer {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 18px;
    background: #0E1A2B;
    color: #D6E4F0;
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-viewer:empty::before {
    content: "Select a folder, set a cap, and click Run to start.";
    color: #6b7b90;
    font-style: italic;
  }
  .log-line { display: block; }
  .log-line.step { color: var(--gold); font-weight: 600; }
  .log-line.error { color: #FF7676; }
  .log-line.success { color: #7EC57E; }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    background: #FAFBFC;
    font-size: 12px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #A0AEC0;
  }
  .status-dot.running { background: var(--gold); animation: pulse 1.2s infinite; }
  .status-dot.success { background: var(--green); }
  .status-dot.failed { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(1.3); }
  }
  .status-label { font-weight: 500; }
  .status-detail { color: var(--muted); }

  /* Results */
  .results {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    max-height: 220px;
    overflow-y: auto;
    font-size: 13px;
  }
  .results h3 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: .4px;
    margin-bottom: 8px;
  }
  .result-row {
    display: flex;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .name { flex: 1; }
  .result-row .size { color: var(--muted); font-size: 12px; margin-right: 12px; }
  .result-row a {
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
  }
  .result-row a:hover { text-decoration: underline; }
  .results-empty { color: var(--muted); font-style: italic; font-size: 12px; }

  /* Tree indentation */
  .tree-children .tree-node { padding-left: 18px; }
  .tree-children .tree-children .tree-node { padding-left: 36px; }
  .tree-children .tree-children .tree-children .tree-node { padding-left: 54px; }
  .tree-children .tree-children .tree-children .tree-children .tree-node { padding-left: 72px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="badge">UCI Nature</span>
    <h1>Wildlife Pipeline</h1>
  </header>

  <main>
    <!-- LEFT PANEL: folder picker + run controls -->
    <section class="panel">
      <div class="panel-header">
        <h2 id="panel-title">Select folders to process</h2>
        <span class="hint" id="folder-hint">Wildlife Camera Photo Database</span>
      </div>

      <div class="form-row" style="padding: 10px 18px 4px; gap: 16px; border-bottom: 1px solid var(--border);">
        <label style="min-width: 0; font-weight: 500; color: var(--text);">Source</label>
        <label style="min-width: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="radio" name="source" value="local" checked /> My Computer
        </label>
        <label style="min-width: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="radio" name="source" value="drive" /> Google Drive
        </label>
      </div>

      <div id="local-controls" style="display: none; padding: 10px 18px; border-bottom: 1px solid var(--border);">
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
          <input type="text" id="local-folder" placeholder="Paste folder path (e.g. C:\Users\Julie\Pictures\Camera)"
                 style="flex: 1; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px;" />
          <button class="btn" id="btn-browse">Browse…</button>
        </div>
        <div id="local-folder-info" style="font-size: 12px; color: var(--muted); min-height: 16px;"></div>
        <div id="target-controls" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);">
          <div style="font-size: 12px; color: var(--muted); margin-bottom: 6px;">
            <b>Upload target:</b> pick a Drive folder below, then check "Upload to Drive".
          </div>
          <div id="target-folder-label" style="font-size: 13px; color: var(--text);">
            <span style="color: var(--muted); font-style: italic;">No target folder selected.</span>
          </div>
        </div>
      </div>

      <div class="panel-body">
        <div id="tree-root" class="tree"></div>
      </div>

      <div class="selected-list" id="selected-list"></div>

      <div class="form-row">
        <label for="max-files">Max files</label>
        <input type="number" id="max-files" min="1" max="100000" placeholder="All" />
        <span class="hint" style="color: var(--muted); font-size: 12px;"></span>
      </div>
      <div class="form-row">
        <label for="chunk-size">Chunk size</label>
        <input type="number" id="chunk-size" min="0" max="20000" value="2000" />
        <span class="hint" style="color: var(--muted); font-size: 12px;"></span>
      </div>
      <div class="form-row">
        <label for="upload">Upload to Drive</label>
        <input type="checkbox" id="upload" />
        <label for="overwrite" style="min-width: 0; margin-left: 12px;">Overwrite</label>
        <input type="checkbox" id="overwrite" />
      </div>

      <div class="estimate" id="estimate"></div>

      <div class="panel-footer">
        <div class="btn-row">
          <button class="btn" id="btn-estimate">Estimate size</button>
          <button class="btn btn-primary" id="btn-run" disabled>Run pipeline</button>
          <button class="btn" id="btn-cancel" style="display: none; color: var(--red); border-color: var(--red);">Cancel</button>
        </div>
        <div style="margin-top: 8px;">
          <button class="btn" id="btn-clear-cache" style="display: none; width: 100%; color: var(--muted);">Clear cached data from last run</button>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: log + results -->
    <section class="panel">
      <div class="panel-header">
        <h2>Pipeline output</h2>
        <span class="hint" id="job-id-label"></span>
      </div>

      <div class="log-viewer" id="log-viewer"></div>

      <div class="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Idle</span>
        <span class="status-detail" id="status-detail"></span>
      </div>

      <div class="results" id="results-panel" style="display: none;">
        <h3>Per-camera CSVs</h3>
        <div id="results-list"></div>
      </div>
    </section>
  </main>
</div>

<script>
const API = ""; // same origin

const state = {
  tree: {},          // folder_id -> { id, name, children, open, loaded }
  rootId: null,
  rootName: "",
  selected: new Set(),
  selectedMeta: new Map(), // id -> name
  currentJob: null,
  eventSource: null,
  source: "local",           // "drive" | "local"
  localFolder: "",
  targetFolder: null,        // { id, name } — drive folder to upload to in local mode
};

function getSource() {
  return document.querySelector('input[name="source"]:checked').value;
}

function setSourceUI(src) {
  state.source = src;
  const drive = src === "drive";
  document.getElementById("panel-title").textContent =
    drive ? "Select folders to process" : "Select local folder";
  document.getElementById("local-controls").style.display = drive ? "none" : "block";
  // In local mode the tree is used ONLY to pick an upload target (single select).
  document.getElementById("target-controls").style.display = drive ? "none" : "block";
  // Clear any conflicting selection state
  state.selected.clear();
  state.selectedMeta.clear();
  state.targetFolder = null;
  renderSelected();
  renderTargetLabel();
  document.getElementById("estimate").innerHTML = "";
  document.getElementById("btn-estimate").style.display = drive ? "" : "none";
  refreshRunButton();
}

function refreshRunButton() {
  const btn = document.getElementById("btn-run");
  if (state.source === "drive") {
    btn.disabled = state.selected.size === 0;
  } else {
    btn.disabled = !state.localFolder;
  }
}

function renderTargetLabel() {
  const el = document.getElementById("target-folder-label");
  if (!el) return;
  if (state.targetFolder) {
    el.innerHTML = `📁 <b>${state.targetFolder.name}</b> <button class="chip" style="border:none;background:#E6F0F9;margin-left:6px;cursor:pointer;" onclick="clearTargetFolder()">clear</button>`;
  } else {
    el.innerHTML = '<span style="color: var(--muted); font-style: italic;">No target folder selected.</span>';
  }
}

function clearTargetFolder() {
  state.targetFolder = null;
  renderTargetLabel();
  renderTree();
}

async function api(path, opts={}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${res.statusText}: ${text}`);
  }
  return res.json();
}

async function loadHealth() {
  try {
    await api("/api/health");
  } catch (e) {
    // server unreachable — no visible indicator needed
  }
}

async function loadFolder(parentId) {
  const data = await api(`/api/folders?parent=${encodeURIComponent(parentId)}`);
  return data;
}

function ensureNode(id, name) {
  if (!state.tree[id]) {
    state.tree[id] = { id, name, children: null, open: false };
  }
  return state.tree[id];
}

function renderTree() {
  const root = document.getElementById("tree-root");
  root.innerHTML = "";
  if (!state.rootId) return;
  const rootNode = state.tree[state.rootId];
  root.appendChild(renderChildren(rootNode));
}

function renderChildren(node) {
  const container = document.createElement("div");
  container.className = "tree-children open";
  if (!node.children) {
    const loading = document.createElement("div");
    loading.className = "tree-loading";
    loading.textContent = "Loading…";
    container.appendChild(loading);
    return container;
  }
  if (node.children.length === 0) {
    const empty = document.createElement("div");
    empty.className = "tree-empty";
    empty.textContent = "(no subfolders)";
    container.appendChild(empty);
    return container;
  }
  for (const child of node.children) {
    container.appendChild(renderNode(child));
  }
  return container;
}

function renderNode(node) {
  const wrap = document.createElement("div");

  const row = document.createElement("div");
  row.className = "tree-node";
  const isSelected = state.source === "local"
    ? (state.targetFolder && state.targetFolder.id === node.id)
    : state.selected.has(node.id);
  if (isSelected) row.classList.add("selected");
  if (node.open) row.classList.add("open");

  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = "▶";
  row.appendChild(caret);

  const cb = document.createElement("input");
  cb.type = state.source === "local" ? "radio" : "checkbox";
  cb.name = "tree-select";
  cb.checked = !!isSelected;
  cb.addEventListener("click", (e) => e.stopPropagation());
  cb.addEventListener("change", () => toggleSelected(node.id, node.name));
  row.appendChild(cb);

  const icon = document.createElement("span");
  icon.className = "folder-icon";
  icon.textContent = "📁";
  row.appendChild(icon);

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = node.name;
  row.appendChild(name);

  row.addEventListener("click", async (e) => {
    if (e.target === cb) return;
    await expandNode(node.id);
    rerenderSubtree(wrap, node);
  });

  wrap.appendChild(row);

  if (node.open) {
    wrap.appendChild(renderChildren(node));
  }

  return wrap;
}

function rerenderSubtree(wrap, node) {
  wrap.innerHTML = "";
  wrap.appendChild(renderNode(node).firstChild);
  if (node.open) {
    wrap.appendChild(renderChildren(node));
  }
}

async function expandNode(id) {
  const node = state.tree[id];
  if (!node) return;
  node.open = !node.open;
  if (node.open && !node.children) {
    try {
      const data = await loadFolder(id);
      node.children = data.folders.map(f => {
        const child = ensureNode(f.id, f.name);
        return child;
      });
    } catch (e) {
      node.children = [];
      console.error(e);
    }
  }
  renderTree();
}

function toggleSelected(id, name) {
  if (state.source === "local") {
    // Local mode: tree clicks set the upload target (single select).
    state.targetFolder = (state.targetFolder && state.targetFolder.id === id)
      ? null
      : { id, name };
    renderTargetLabel();
    renderTree();
    return;
  }
  if (state.selected.has(id)) {
    state.selected.delete(id);
    state.selectedMeta.delete(id);
  } else {
    state.selected.add(id);
    state.selectedMeta.set(id, name);
  }
  renderSelected();
  refreshRunButton();
  document.getElementById("estimate").innerHTML = "";
}

function renderSelected() {
  const box = document.getElementById("selected-list");
  box.innerHTML = "";
  for (const id of state.selected) {
    const name = state.selectedMeta.get(id) || id;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = name;
    const close = document.createElement("button");
    close.textContent = "✕";
    close.title = "Remove";
    close.addEventListener("click", () => toggleSelected(id, name));
    chip.appendChild(close);
    box.appendChild(chip);
  }
  renderTree();
}

async function initTree() {
  const data = await loadFolder("");
  state.rootId = data.parent.id;
  state.rootName = data.parent.name;
  document.getElementById("folder-hint").textContent = data.parent.name;
  const rootNode = ensureNode(state.rootId, state.rootName);
  rootNode.open = true;
  rootNode.children = data.folders.map(f => ensureNode(f.id, f.name));
  renderTree();
}

async function doEstimate() {
  if (state.selected.size === 0) return;
  const el = document.getElementById("estimate");
  el.innerHTML = "Estimating…";
  let total = 0;
  let truncated = false;
  for (const id of state.selected) {
    try {
      const res = await api(`/api/folders/count?parent=${encodeURIComponent(id)}&limit=5000`);
      total += res.image_count;
      if (res.truncated) truncated = true;
    } catch (e) {
      console.error(e);
    }
  }
  const cap = parseInt(document.getElementById("max-files").value, 10) || 0;
  el.innerHTML = `Found <b>${total}${truncated ? "+" : ""}</b> image${total === 1 ? "" : "s"}. ` +
    (cap > 0 ? `This run will process the first <b>${Math.min(cap, total)}</b>.` : "");
}

async function doRun() {
  const chunkSizeRaw = parseInt(document.getElementById("chunk-size").value, 10);
  const chunkSize = Number.isFinite(chunkSizeRaw) && chunkSizeRaw >= 0 ? chunkSizeRaw : 2000;
  const upload = document.getElementById("upload").checked;
  const overwrite = document.getElementById("overwrite").checked;
  const maxFiles = parseInt(document.getElementById("max-files").value, 10) || null;

  let body;
  if (state.source === "drive") {
    const folders = [...state.selected];
    if (folders.length === 0) return;
    body = {
      source: "drive",
      folders,
      max_files: maxFiles,
      chunk_size: chunkSize,
      upload,
      overwrite,
    };
  } else {
    if (!state.localFolder) return;
    if (upload && !state.targetFolder) {
      alert("Upload is checked but no Drive target folder is selected. Pick a folder in the tree, or uncheck Upload.");
      return;
    }
    body = {
      source: "local",
      local_folder: state.localFolder,
      target_drive_folder: state.targetFolder ? state.targetFolder.id : "",
      upload,
      overwrite,
    };
  }

  document.getElementById("btn-run").disabled = true;
  document.getElementById("log-viewer").innerHTML = "";
  document.getElementById("results-panel").style.display = "none";
  setStatus("starting", "Starting pipeline…", "");

  try {
    const res = await api("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    state.currentJob = res.job_id;
    document.getElementById("job-id-label").textContent = `job ${res.job_id}`;
    streamLog(res.job_id);
  } catch (e) {
    setStatus("failed", "Failed to start", e.message);
    document.getElementById("btn-run").disabled = false;
  }
}

function streamLog(jobId) {
  if (state.eventSource) state.eventSource.close();
  const viewer = document.getElementById("log-viewer");
  setStatus("running", "Running…", "");
  document.getElementById("btn-cancel").style.display = "inline-flex";

  // Track how many log lines we've already appended so reconnects don't duplicate.
  let seenLines = viewer.querySelectorAll(".log-line").length;
  let ended = false;
  let retryDelay = 1500;

  const open = () => {
    const es = new EventSource(`/api/jobs/${jobId}/log?mode=stream`);
    state.eventSource = es;
    let localCount = 0;

    es.onmessage = (ev) => {
      try {
        const payload = JSON.parse(ev.data);
        if (payload.line !== undefined) {
          // On reconnect the server replays the full log; skip lines we've already seen.
          localCount++;
          if (localCount <= seenLines) return;
          appendLine(viewer, payload.line);
          seenLines = localCount;
        }
      } catch (e) { /* ignore */ }
    };

    es.addEventListener("end", async (ev) => {
      ended = true;
      es.close();
      state.eventSource = null;
      let status = "success";
      try {
        const payload = JSON.parse(ev.data);
        status = payload.status || "success";
      } catch (e) {}
      finalize(status);
    });

    es.onerror = async () => {
      if (ended) return;
      es.close();
      state.eventSource = null;

      // Before declaring a failure, ask the server whether the job is still running.
      try {
        const info = await api(`/api/jobs/${jobId}`);
        if (info.status === "running" || info.status === "starting") {
          setStatus("running", "Running…", "Stream reconnecting…");
          setTimeout(open, retryDelay);
          retryDelay = Math.min(retryDelay * 1.5, 10_000);
          return;
        }
        finalize(info.status || "failed");
      } catch (e) {
        finalize("failed");
      }
    };
  };

  const finalize = async (status) => {
    document.getElementById("btn-cancel").style.display = "none";
    document.getElementById("btn-run").disabled = false;
    document.getElementById("btn-clear-cache").style.display = "block";
    const kindMap = { success: "success", failed: "failed", cancelled: "failed" };
    const labelMap = { success: "Done", failed: "Failed", cancelled: "Cancelled" };
    const detailMap = {
      success: "Completed successfully",
      failed: "Pipeline failed — check log",
      cancelled: "Run was cancelled",
    };
    setStatus(kindMap[status] || "failed",
              labelMap[status] || "Finished",
              detailMap[status] || "");
    await loadResults(jobId);
  };

  open();
}

async function doCancel() {
  if (!state.currentJob) return;
  try {
    await api(`/api/jobs/${state.currentJob}/cancel`, { method: "POST" });
    setStatus("running", "Cancelling…", "Sent stop signal");
  } catch (e) {
    console.error(e);
  }
}

function appendLine(viewer, line) {
  const el = document.createElement("span");
  el.className = "log-line";
  if (/^STEP:/i.test(line) || /^=+$/.test(line)) el.classList.add("step");
  else if (/error|failed|traceback/i.test(line)) el.classList.add("error");
  else if (/\bdone\b|completed|✓/i.test(line)) el.classList.add("success");
  el.textContent = line + "\n";
  viewer.appendChild(el);
  viewer.scrollTop = viewer.scrollHeight;
}

function setStatus(kind, label, detail) {
  const dot = document.getElementById("status-dot");
  dot.classList.remove("running", "success", "failed");
  if (kind) dot.classList.add(kind);
  document.getElementById("status-label").textContent = label;
  document.getElementById("status-detail").textContent = detail || "";
}

async function loadResults(jobId) {
  try {
    const res = await api(`/api/jobs/${jobId}/result`);
    const list = document.getElementById("results-list");
    list.innerHTML = "";
    if (!res.by_location || res.by_location.length === 0) {
      list.innerHTML = '<div class="results-empty">No per-camera CSVs produced.</div>';
    } else {
      for (const f of res.by_location) {
        const row = document.createElement("div");
        row.className = "result-row";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = f.name;
        row.appendChild(name);

        const size = document.createElement("span");
        size.className = "size";
        size.textContent = humanSize(f.size);
        row.appendChild(size);

        const link = document.createElement("a");
        link.href = `/api/download?path=${encodeURIComponent(f.path)}`;
        link.textContent = "Download";
        row.appendChild(link);

        list.appendChild(row);
      }
    }
    document.getElementById("results-panel").style.display = "block";
  } catch (e) {
    console.error(e);
  }
}

function humanSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

document.getElementById("btn-run").addEventListener("click", doRun);
document.getElementById("btn-estimate").addEventListener("click", doEstimate);
document.getElementById("btn-cancel").addEventListener("click", doCancel);
document.getElementById("btn-clear-cache").addEventListener("click", async () => {
  const btn = document.getElementById("btn-clear-cache");
  btn.disabled = true;
  btn.textContent = "Clearing…";
  try {
    const res = await api("/api/clear_cache", { method: "POST" });
    btn.textContent = `Cleared (${res.cleared} items removed)`;
  } catch (e) {
    btn.textContent = "Clear failed — try again";
    btn.disabled = false;
  }
});

for (const el of document.querySelectorAll('input[name="source"]')) {
  el.addEventListener("change", (e) => setSourceUI(e.target.value));
}

document.getElementById("local-folder").addEventListener("input", async (e) => {
  state.localFolder = e.target.value.trim();
  refreshRunButton();
  await updateLocalFolderInfo();
});

document.getElementById("btn-browse").addEventListener("click", async () => {
  try {
    const res = await api("/api/browse_folder");
    if (res.path) {
      document.getElementById("local-folder").value = res.path;
      state.localFolder = res.path;
      refreshRunButton();
      await updateLocalFolderInfo();
    }
  } catch (e) {
    const info = document.getElementById("local-folder-info");
    info.textContent = "Folder picker unavailable — paste the path manually.";
  }
});

async function updateLocalFolderInfo() {
  const info = document.getElementById("local-folder-info");
  if (!state.localFolder) {
    info.textContent = "";
    return;
  }
  info.textContent = "Checking…";
  try {
    const res = await api(`/api/check_folder?path=${encodeURIComponent(state.localFolder)}`);
    if (res.exists && res.is_dir) {
      info.innerHTML = `Found <b>${res.image_count}</b> image${res.image_count === 1 ? "" : "s"} in this folder.`;
    } else {
      info.textContent = res.error || "Folder not found.";
    }
  } catch (e) {
    info.textContent = "Folder not found or unreadable.";
  }
}

setSourceUI("local");
loadHealth();
initTree().catch(e => {
  document.getElementById("tree-root").innerHTML =
    `<div class="tree-empty">Failed to load folders: ${e.message}</div>`;
});
</script>
</body>
